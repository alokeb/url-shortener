# This whole file is Spring Boot's central config mechanism: any bean anywhere in the app
# can ask for a value from here (Spring auto-wires it in), and Spring Boot itself reads
# many of these keys to auto-configure beans for you (e.g. the spring.datasource.* keys
# below are all Spring needs to build a working database connection pool - no Java code
# required, unlike UrlMapping/UrlMappingRepository/etc.).
spring.application.name=url-shortener

# ${DB_HOST:localhost} means "read the DB_HOST environment variable; if it isn't set, use
# 'localhost' instead". This is what lets the exact same built jar/image work correctly in
# three different places without code changes: running directly (env vars unset -> falls
# back to localhost), under docker-compose (DB_HOST=postgres, the other container's service
# name), or eventually in Kubernetes (env vars injected differently again). DB_USER and
# DB_PASSWORD below have NO ":default" fallback deliberately - that's not a typo, it means
# the app refuses to start rather than silently connecting with a guessable credential if
# they're missing. See .env.example for what needs to be supplied.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urlshortener}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ddl-auto=update tells Hibernate to inspect UrlMapping's @Entity/@Column annotations at
# startup and automatically create/alter database tables to match - that's why there's no
# hand-written SQL schema anywhere in this project. Fine for a learning project; a real
# production setup would normally use a migration tool (e.g. Flyway/Liquibase) instead, so
# schema changes are explicit, reviewable, and reversible rather than inferred on every boot.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Spring Boot hides validation error details from API responses by default (a 400 response
# would otherwise just say "Bad Request" with no explanation of what was wrong). These two
# turn that detail back on - useful while developing, worth reconsidering for a real
# public-facing production API where you may not want to reveal internal validation logic.
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
