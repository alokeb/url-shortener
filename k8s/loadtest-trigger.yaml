# A tiny in-cluster HTTP endpoint that (re)creates the load-test Job below on any incoming
# request - what the Overview Grafana dashboard's "Run Stress Test" panel links to, so the
# stress test can be kicked off with a click instead of a separate `kubectl apply`. Runs as
# its own narrowly-scoped ServiceAccount (Role, below) that can only create/delete/get/list
# Jobs in this one namespace - it has no other permissions in the cluster at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loadtest-trigger
  namespace: url-shortener
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loadtest-trigger
  namespace: url-shortener
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loadtest-trigger
  namespace: url-shortener
subjects:
  - kind: ServiceAccount
    name: loadtest-trigger
    namespace: url-shortener
roleRef:
  kind: Role
  name: loadtest-trigger
  apiGroup: rbac.authorization.k8s.io
---
# Same "reuse a generic image, mount the logic in" trick as load-test-job.yaml's own script
# ConfigMap - no custom image built/maintained just for this. trigger.sh both live-patches the
# HPA to the min/max replicas requested (query params on the request, set by the Overview
# dashboard's Min/Max replica variables - see k8s/dashboards/url-shortener-overview.json) and
# (re)creates the load-test Job scaled to match, so there's enough aggregate load to actually
# justify scaling that high (Job names/specs are immutable once created, so a completed
# previous run has to be deleted before a new one can start). Reuses the load-test-script
# ConfigMap (from k8s/load-test-job.yaml, applied once, unchanged, alongside this file - see
# terraform/loadtest_trigger.tf's comment on why Terraform applies it up front) for the actual
# curl-loop logic; only the Job's own parallelism/completions are generated here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadtest-trigger-scripts
  namespace: url-shortener
data:
  trigger.sh: |
    #!/bin/sh
    set -eu

    # socat's SYSTEM: address wires the accepted connection to this script's stdin/stdout -
    # the request line (e.g. "GET /trigger?min=2&max=10 HTTP/1.1") is the first thing on
    # stdin.
    read -r request_line
    path_and_query=$(printf '%s' "$request_line" | awk '{print $2}')
    query=""
    case "$path_and_query" in
      *\?*) query="${path_and_query#*\?}" ;;
    esac

    # Drain the rest of the request (headers, up to the blank CRLF line that ends them) before
    # writing any response - if the OS still has unread bytes sitting in this connection's
    # receive buffer when the script exits and socat closes it, it sends a TCP RST instead of
    # a clean FIN. `curl` tolerates that fine (which is why manual curl testing looked like it
    # worked perfectly), but a real browser's fetch() treats a RST as a hard network error and
    # fails the request silently - exactly what was happening to the dashboard's button click.
    while IFS= read -r line; do
      line=${line%$(printf '\r')}
      [ -z "$line" ] && break
    done

    get_param() {
      printf '%s\n' "$query" | tr '&' '\n' | sed -n "s/^$1=//p" | head -n1
    }

    is_positive_int() {
      case "$1" in
        ''|*[!0-9]*) return 1 ;;
        *) return 0 ;;
      esac
    }

    # One endpoint, toggling on whether the Job currently has any active pods - this is the
    # server-side half of the same state the Overview dashboard's button queries
    # (kube_job_status_active) to decide whether to show "Run" or "Stop", so a click always
    # does the opposite of whatever's currently true. `|| true` + the case normalization below
    # both handle "no such Job" (never started, or already deleted) the same as "0 active".
    ACTIVE=$(kubectl get job load-test -n url-shortener -o jsonpath='{.status.active}' 2>/dev/null || true)
    case "$ACTIVE" in
      ''|*[!0-9]*) ACTIVE=0 ;;
    esac

    # Both branches deliberately block until the change they made is visible in PROMETHEUS -
    # not merely accepted by the API server. That's what keeps the Overview dashboard's button
    # spinner up for the whole wait: Grafana's Canvas button shows a spinner from click until
    # the HTTP response lands (its loading state is wired to the fetch lifecycle, with no way
    # to bind it to query data), and the button's own label is driven by a Prometheus query -
    # so returning any earlier than this just trades a spinner for a stale label. Waiting on
    # the Job via kubectl alone isn't enough for the same reason: kubectl sees the change
    # immediately, Prometheus only on its next scrape of kube-state-metrics.
    #
    # Each wait is separately bounded (first arg = max seconds) and non-fatal on timeout, so a
    # wedged cluster degrades to "answers anyway, label catches up late" rather than hanging.
    # The two limits are kept low enough that even back-to-back worst cases stay under the
    # browser/Grafana fetch timeout.
    wait_for() {
      limit=$1
      shift
      i=0
      while [ "$i" -lt "$limit" ]; do
        "$@" && return 0
        sleep 1
        i=$((i + 1))
      done
      return 1
    }

    job_active() {
      a=$(kubectl get job load-test -n url-shortener -o jsonpath='{.status.active}' 2>/dev/null || true)
      case "$a" in ''|*[!0-9]*) a=0 ;; esac
      [ "$a" -gt 0 ]
    }

    job_gone() {
      ! kubectl get job load-test -n url-shortener >/dev/null 2>&1
    }

    # Exactly the query the dashboard button's own panel runs, so "Prometheus agrees" here
    # means the label is about to render correctly. Cheap sed rather than a JSON parser: the
    # `or on() vector(0)` guarantees exactly one result, so there's only ever one "value" pair.
    PROM_URL="http://monitoring-kube-prometheus-prometheus.monitoring:9090/api/v1/query"
    PROM_QUERY='kube_job_status_active{namespace="url-shortener",job_name="load-test"} or on() vector(0)'

    prom_value() {
      curl -sf -m 2 -G "$PROM_URL" --data-urlencode "query=$PROM_QUERY" 2>/dev/null \
        | sed -n 's/.*"value":\[[^,]*,"\([0-9.]*\)"\].*/\1/p' | head -n1
    }

    prom_active() { v=$(prom_value); [ -n "$v" ] && [ "${v%%.*}" -gt 0 ]; }
    prom_idle()   { v=$(prom_value); [ -n "$v" ] && [ "${v%%.*}" -eq 0 ]; }

    # enable_monitoring=false is a supported configuration (see terraform/variables.tf), and
    # there's no Prometheus to wait on in that case - skip rather than burn the full timeout.
    prom_reachable() { [ -n "$(prom_value)" ]; }

    if [ "$ACTIVE" -gt 0 ]; then
      LOG=$(kubectl delete job load-test -n url-shortener --ignore-not-found 2>&1)
      printf '%s\n' "$LOG" 1>&2
      wait_for 15 job_gone || printf 'timed out waiting for job to disappear\n' 1>&2
      if prom_reachable; then
        wait_for 15 prom_idle || printf 'timed out waiting for Prometheus to report idle\n' 1>&2
      fi
      BODY="{\"status\":\"stopped\",\"message\":\"Load test stopped.\"}"
    else
      MIN_RAW=$(get_param min)
      MAX_RAW=$(get_param max)

      if is_positive_int "$MIN_RAW" && [ "$MIN_RAW" -ge 1 ]; then MIN="$MIN_RAW"; else MIN=1; fi
      if is_positive_int "$MAX_RAW" && [ "$MAX_RAW" -ge 1 ]; then MAX="$MAX_RAW"; else MAX=3; fi

      # 30 matches the ceiling this project already tested up to (see k8s/hpa.yaml's
      # host-stress-test history) - a sanity cap, not a hard Kubernetes limit. min is never
      # allowed above max, so a mistyped value can't wedge the HPA in an impossible state.
      [ "$MAX" -gt 30 ] && MAX=30
      [ "$MIN" -gt "$MAX" ] && MIN="$MAX"

      # One load-generator Job pod (40 concurrent curl workers each, see load-test-script's
      # CONCURRENCY) roughly per target replica - a simple heuristic, not an exact CPU model,
      # but enough sustained aggregate load that the HPA has a real reason to scale all the
      # way to MAX instead of plateauing well below it.
      PARALLELISM="$MAX"

      JOB_YAML="apiVersion: batch/v1
    kind: Job
    metadata:
      name: load-test
      namespace: url-shortener
    spec:
      backoffLimit: 0
      parallelism: $PARALLELISM
      completions: $PARALLELISM
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: load-test
              image: curlimages/curl:8.11.0
              command: [\"sh\", \"/scripts/load-test.sh\"]
              env:
                - name: DURATION_SECONDS
                  value: \"600\"
                - name: CONCURRENCY
                  value: \"40\"
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 200m
                  memory: 100Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: script
              configMap:
                name: load-test-script"

      LOG=$(
        kubectl patch hpa url-shortener-app -n url-shortener --type=merge \
          -p "{\"spec\":{\"minReplicas\":$MIN,\"maxReplicas\":$MAX}}" 2>&1
        kubectl delete job load-test -n url-shortener --ignore-not-found 2>&1
        printf '%s\n' "$JOB_YAML" | kubectl apply -n url-shortener -f - 2>&1
      )

      printf '%s\n' "$LOG" 1>&2
      wait_for 15 job_active || printf 'timed out waiting for load-test pods to start\n' 1>&2
      if prom_reachable; then
        wait_for 15 prom_active || printf 'timed out waiting for Prometheus to report active\n' 1>&2
      fi
      BODY="{\"status\":\"started\",\"minReplicas\":$MIN,\"maxReplicas\":$MAX,\"loadGeneratorPods\":$PARALLELISM,\"message\":\"Load test started: HPA min=$MIN max=$MAX, $PARALLELISM load-generator pod(s).\"}"
    fi

    # JSON, not text/plain, and deliberately so: the Overview dashboard's Canvas button calls
    # this through Grafana's own backendSrv.fetch(), which parses every response body as JSON
    # and surfaces a parse failure as a generic "An error has occurred" toast - a 200 with a
    # human-readable sentence in it still counts as a failed call from the button's point of
    # view (confirmed by reading Grafana's compiled canvas panel code; see INCIDENTS.md).
    # kubectl's own output goes to stderr instead, which socat leaves attached to the
    # container's logs rather than the client socket - so `kubectl logs deploy/loadtest-trigger`
    # still shows exactly what was applied, without corrupting the JSON body.
    printf 'HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nCache-Control: no-store\r\nConnection: close\r\nContent-Length: %s\r\n\r\n%s' "${#BODY}" "$BODY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadtest-trigger
  namespace: url-shortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadtest-trigger
  template:
    metadata:
      labels:
        app: loadtest-trigger
    spec:
      serviceAccountName: loadtest-trigger
      containers:
        # alpine/k8s already bundles kubectl (pre-configured for in-cluster auth via the
        # mounted ServiceAccount token, standard kubectl behavior - no extra setup needed);
        # socat isn't in the image by default, so it's installed at container start rather
        # than via a custom Dockerfile, matching this project's "no bespoke images" pattern
        # elsewhere. socat's SYSTEM: address forks the given command for every inbound
        # connection with the socket wired to its stdin/stdout - the simplest way to turn a
        # plain shell script into an HTTP listener without an actual HTTP server/framework.
        - name: trigger
          image: alpine/k8s:1.31.1
          command:
            - sh
            - -c
            - apk add --no-cache socat >/tmp/apk.log 2>&1 && exec socat TCP-LISTEN:8080,fork,reuseaddr SYSTEM:"sh /scripts/trigger.sh"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: scripts
          configMap:
            name: loadtest-trigger-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: loadtest-trigger
  namespace: url-shortener
spec:
  selector:
    app: loadtest-trigger
  ports:
    - name: http
      port: 8080
      targetPort: 8080
