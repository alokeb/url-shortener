# The Kubernetes-native replacement for .env, per the plan flagged when the Kubernetes phase
# started: same not-a-real-secret placeholder values as .env, so it's fine to commit openly
# just like .env is (see CLAUDE.md) - if this ever holds real credentials, it needs to stop
# being committed and get generated some other way (e.g. `kubectl create secret` run by hand,
# or a proper secrets manager) instead.
#
# stringData (vs. data) lets the values be written as plain text here - Kubernetes base64-
# encodes them into the real Secret object itself on apply. Secret != encrypted: base64 is
# trivially reversible, this only keeps credentials out of Pod specs/ConfigMaps and out of
# `kubectl get all` output by default. Real confidentiality would need encryption-at-rest
# (etcd) and RBAC restricting who can `kubectl get secret`, neither of which matters for a
# single-user local minikube cluster.
apiVersion: v1
kind: Secret
metadata:
  name: url-shortener-db
  namespace: url-shortener
type: Opaque
stringData:
  DB_NAME: urlshortener
  DB_USER: urlshortener
  DB_PASSWORD: local-dev-only-not-a-real-secret
